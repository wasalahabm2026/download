<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#111827"
  >

  <meta
    name="description"
    content="وصّلها BM - اطلبها... وإحنا نوصلها! حمّل التطبيق الآن."
  >

  <meta
    property="og:title"
    content="وصّلها BM | اطلبها... وإحنا نوصلها!"
  >

  <meta
    property="og:description"
    content="حمّل تطبيق وصّلها BM واطلب أكلك المفضل بسهولة."
  >

  <meta
    property="og:type"
    content="website"
  >

  <title>
    وصّلها BM | اطلبها... وإحنا نوصلها!
  </title>


  <style>

    :root {

      --yellow: #FFB800;
      --yellow-light: #FFC933;

      --navy: #111827;
      --navy-dark: #0b1220;

      --card: #182235;

      --white: #ffffff;

      --muted: #9ca3af;

      --text-light: #d1d5db;

      --line: rgba(255,255,255,.09);

    }


    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

      color: var(--white);

      background:

        radial-gradient(
          circle at 50% 5%,
          rgba(255,184,0,.13),
          transparent 28%
        ),

        radial-gradient(
          circle at 10% 80%,
          rgba(30,64,175,.10),
          transparent 28%
        ),

        var(--navy-dark);

      overflow-x: hidden;

    }


    .page {

      min-height: 100vh;

      display: flex;

      flex-direction: column;

    }


    /* ==============================
       HEADER
       ============================== */

    header {

      padding: 24px 18px 10px;

      text-align: center;

    }


    .brand {

      display: inline-flex;

      align-items: center;

      gap: 9px;

      font-size: 20px;

      font-weight: 900;

    }


    .dot {

      width: 10px;

      height: 10px;

      border-radius: 50%;

      background: var(--yellow);

      box-shadow:
        0 0 18px rgba(255,184,0,.75);

    }


    /* ==============================
       MAIN
       ============================== */

    main {

      flex: 1;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 30px 16px 55px;

    }


    .card {

      width: min(920px,100%);

      padding: 38px;

      border-radius: 30px;

      border:
        1px solid var(--line);

      background:

        linear-gradient(
          145deg,
          rgba(24,34,53,.97),
          rgba(17,24,39,.98)
        );

      box-shadow:
        0 30px 90px rgba(0,0,0,.40);

      position: relative;

      overflow: hidden;

    }


    .card::before {

      content: "";

      position: absolute;

      inset: 0;

      background:

        linear-gradient(
          110deg,
          rgba(255,255,255,.035),
          transparent 35%,
          rgba(255,184,0,.025)
        );

      pointer-events: none;

    }


    /* ==============================
       HERO
       ============================== */

    .hero {

      display: grid;

      grid-template-columns: 280px 1fr;

      gap: 46px;

      align-items: center;

      position: relative;

      z-index: 1;

    }


    /* ==============================
       LOGO
       ============================== */

    .logo {

      width: 250px;

      height: 250px;

      margin: auto;

      padding: 10px;

      border-radius: 48px;

      background:
        rgba(255,184,0,.08);

      border:
        1px solid rgba(255,184,0,.20);

      box-shadow:

        0 0 55px
        rgba(255,184,0,.10),

        0 20px 50px
        rgba(0,0,0,.30);

    }


    .logo img {

      width: 100%;

      height: 100%;

      object-fit: cover;

      border-radius: 39px;

      display: block;

    }


    /* ==============================
       CONTENT
       ============================== */

    .content {

      text-align: right;

    }


    .badge {

      display: inline-flex;

      align-items: center;

      gap: 7px;

      padding: 8px 13px;

      border-radius: 999px;

      color: var(--yellow);

      background:
        rgba(255,184,0,.09);

      border:
        1px solid rgba(255,184,0,.16);

      font-size: 13px;

      font-weight: 800;

    }


    .badge::before {

      content: "";

      width: 7px;

      height: 7px;

      border-radius: 50%;

      background: var(--yellow);

      box-shadow:
        0 0 10px rgba(255,184,0,.9);

    }


    h1 {

      margin: 17px 0 5px;

      font-size:
        clamp(42px,6vw,65px);

      line-height: 1;

      letter-spacing: -2px;

      font-weight: 900;

    }


    h1 span {

      color: var(--yellow);

    }


    .slogan {

      font-size:
        clamp(21px,3vw,30px);

      font-weight: 900;

      margin: 17px 0 9px;

      line-height: 1.3;

    }


    .desc {

      margin: 0;

      color: var(--text-light);

      font-size: 16px;

      line-height: 1.9;

    }


    /* ==============================
       DOWNLOAD BUTTON
       ============================== */

    .download {

      width: 100%;

      min-height: 62px;

      margin-top: 25px;

      border: 0;

      border-radius: 17px;

      background:

        linear-gradient(
          135deg,
          var(--yellow),
          var(--yellow-light)
        );

      color: var(--navy);

      font-family: inherit;

      font-size: 19px;

      font-weight: 900;

      cursor: pointer;

      box-shadow:
        0 13px 35px
        rgba(255,184,0,.20);

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        filter .2s ease;

    }


    .download:hover {

      transform: translateY(-2px);

      box-shadow:
        0 18px 42px
        rgba(255,184,0,.30);

      filter: saturate(1.06);

    }


    .download:active {

      transform: translateY(0);

    }


    .download:disabled {

      opacity: .65;

      cursor: not-allowed;

      transform: none;

    }


    /* ==============================
       STATS
       ============================== */

    .stats {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 12px;

      margin-top: 13px;

    }


    .stat {

      padding: 15px 16px;

      min-height: 74px;

      border-radius: 16px;

      border:
        1px solid var(--line);

      background:
        rgba(255,255,255,.025);

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

    }


    .label {

      color: var(--muted);

      font-size: 13px;

    }


    .value {

      font-size: 20px;

      font-weight: 900;

      direction: ltr;

      unicode-bidi: plaintext;

    }


    /* ==============================
       INFO
       ============================== */

    .info {

      display: flex;

      flex-wrap: wrap;

      justify-content: flex-start;

      gap: 9px;

      margin-top: 13px;

    }


    .pill {

      padding: 9px 12px;

      border-radius: 13px;

      border:
        1px solid var(--line);

      background:
        rgba(255,255,255,.025);

      color: var(--text-light);

      font-size: 13px;

    }


    .pill b {

      color: #fff;

    }


    /* ==============================
       STATUS
       ============================== */

    .status {

      min-height: 20px;

      margin-top: 15px;

      color: var(--muted);

      font-size: 12px;

      line-height: 1.7;

    }


    /* ==============================
       FOOTER
       ============================== */

    footer {

      text-align: center;

      padding: 0 16px 25px;

      color: #6b7280;

      font-size: 12px;

      line-height: 1.8;

    }


    footer b {

      color: #9ca3af;

    }


    /* ==============================
       LOADING
       ============================== */

    .loading {

      display: inline-block;

      width: 14px;

      height: 14px;

      border:
        2px solid
        rgba(255,255,255,.25);

      border-top-color:
        var(--yellow);

      border-radius: 50%;

      animation:
        spin .8s linear infinite;

      vertical-align: middle;

      margin-left: 5px;

    }


    @keyframes spin {

      to {

        transform:
          rotate(360deg);

      }

    }


    /* ==============================
       MOBILE
       ============================== */

    @media(max-width:720px) {

      main {

        padding:
          20px 12px 40px;

      }


      .card {

        padding:
          24px 17px;

        border-radius: 24px;

      }


      .hero {

        grid-template-columns: 1fr;

        gap: 25px;

      }


      .logo {

        width: 205px;

        height: 205px;

        border-radius: 40px;

      }


      .logo img {

        border-radius: 32px;

      }


      .content {

        text-align: center;

      }


      .desc {

        font-size: 15px;

      }


      .stats {

        text-align: right;

      }


      .info {

        justify-content: center;

      }

    }


    @media(max-width:390px) {

      .stats {

        grid-template-columns: 1fr;

      }


      h1 {

        font-size: 39px;

      }


      .slogan {

        font-size: 20px;

      }


      .download {

        min-height: 58px;

        font-size: 17px;

      }

    }

  </style>

</head>


<body>


<div class="page">


  <!-- HEADER -->

  <header>

    <div class="brand">

      <span class="dot"></span>

      <span>
        وصّلها BM
      </span>

    </div>

  </header>


  <!-- MAIN -->

  <main>

    <section
      class="card"
      aria-label="تحميل تطبيق وصّلها BM"
    >


      <div class="hero">


        <!-- LOGO -->

        <div class="logo">

          <img
            src="assets/logo.png"
            alt="لوجو وصّلها BM"
          >

        </div>


        <!-- CONTENT -->

        <div class="content">


          <div class="badge">

            التطبيق الرسمي

          </div>


          <h1>

            وصّلها

            <span>
              BM
            </span>

          </h1>


          <div class="slogan">

            اطلبها... وإحنا نوصلها!

          </div>


          <p class="desc">

            حمّل تطبيق وصّلها BM
            واطلب أكلك المفضل بسهولة
            من مطاعمك المفضلة.

          </p>


          <!-- DOWNLOAD BUTTON -->

          <button
            id="downloadBtn"
            class="download"
            type="button"
          >

            تحميل التطبيق

          </button>


          <!-- STATS -->

          <div class="stats">


            <div class="stat">

              <span class="label">

                ⬇️ عدد التحميلات

              </span>

              <span
                id="downloads"
                class="value"
              >

                --

              </span>

            </div>


            <div class="stat">

              <span class="label">

                👁️ المشاهدات

              </span>

              <span
                id="views"
                class="value"
              >

                --

              </span>

            </div>


          </div>


          <!-- INFO -->

          <div class="info">


            <div class="pill">

              📱

              <b>
                Android
              </b>

            </div>


            <div class="pill">

              الإصدار

              <b id="version">
                1.0.0
              </b>

            </div>


            <div class="pill">

              APK

              <b>
                BM.apk
              </b>

            </div>


          </div>


          <!-- STATUS -->

          <div
            id="status"
            class="status"
          >

            جاري جلب عدد التحميلات...

          </div>


        </div>

      </div>

    </section>

  </main>


  <!-- FOOTER -->

  <footer>

    <b>
      وصّلها BM
    </b>

    — اطلبها... وإحنا نوصلها!

    <br>

    © 2026 وصّلها BM
    - جميع الحقوق محفوظة

  </footer>


</div>


<script>


/*
=====================================================
إعدادات الموقع
=====================================================
*/


const CONFIG = {


  /*
  اسم التطبيق
  */

  appName:
    "وصّلها BM",


  /*
  إصدار التطبيق
  */

  version:
    "1.0.0",


  /*
  ===================================================
  رابط APK الحقيقي
  ===================================================

  ده رابط ملف BM.apk الموجود في GitHub Release
  */

  apkUrl:
    "https://github.com/wasalahabm2026/download/releases/download/v1.0.0/BM.apk",


  /*
  ===================================================
  إعدادات العداد
  ===================================================

  نستخدم عدادًا مركزيًا مستقلًا عن GitHub.

  Namespace:
  wasalahabm2026

  Key:
  downloads

  كل ضغطة على تحميل = +1
  */

  counterNamespace:
    "wasalahabm2026",


  counterKey:
    "downloads",


  /*
  عداد المشاهدات

  كل فتح للصفحة = +1

  لو مش عايزه ممكن نخليه false.
  */

  countViews:
    true

};


/*
=====================================================
عناصر الصفحة
=====================================================
*/


const downloadBtn =
  document.getElementById(
    "downloadBtn"
  );


const downloadsElement =
  document.getElementById(
    "downloads"
  );


const viewsElement =
  document.getElementById(
    "views"
  );


const statusElement =
  document.getElementById(
    "status"
  );


const versionElement =
  document.getElementById(
    "version"
  );


/*
=====================================================
عرض الإصدار
=====================================================
*/


versionElement.textContent =
  CONFIG.version;


/*
=====================================================
تنسيق الأرقام
=====================================================
*/


function formatNumber(number) {


  if (
    typeof number !== "number" ||
    Number.isNaN(number)
  ) {

    return "--";

  }


  return new Intl.NumberFormat(
    "ar-EG"
  ).format(number);

}


/*
=====================================================
تغيير حالة الموقع
=====================================================
*/


function setStatus(message) {

  statusElement.innerHTML =
    message;

}


/*
=====================================================
رابط Counter API
=====================================================
*/


function counterUrl(
  type
) {


  return (

    "https://abacus.jasoncameron.dev/" +

    type +

    "/" +

    encodeURIComponent(
      CONFIG.counterNamespace
    ) +

    "/" +

    encodeURIComponent(
      CONFIG.counterKey
    )

  );

}


/*
=====================================================
قراءة عداد التحميلات
=====================================================
*/


async function getDownloadCount() {


  try {


    const response =
      await fetch(

        counterUrl("get"),

        {

          method:
            "GET",

          cache:
            "no-store"

        }

      );


    if (!response.ok) {

      throw new Error(
        "Counter API error: " +
        response.status
      );

    }


    const data =
      await response.json();


    /*
    API يرجع:

    {
      "value": 123
    }
    */


    const value =
      Number(data.value);


    if (
      Number.isFinite(value)
    ) {

      downloadsElement.textContent =
        formatNumber(value);

    }


  }

  catch(error) {


    console.error(
      "Download counter error:",
      error
    );


    downloadsElement.textContent =
      "--";

  }

}


/*
=====================================================
زيادة عداد التحميلات
=====================================================
*/


async function incrementDownloadCount() {


  try {


    /*
    hit = زيادة العداد + إرجاع القيمة الجديدة
    */

    const response =
      await fetch(

        counterUrl("hit"),

        {

          method:
            "GET",

          cache:
            "no-store"

        }

      );


    if (!response.ok) {

      throw new Error(
        "Counter increment error: " +
        response.status
      );

    }


    const data =
      await response.json();


    /*
    القيمة الجديدة
    */

    const newValue =
      Number(data.value);


    if (
      Number.isFinite(newValue)
    ) {

      /*
      تحديث الرقم فورًا
      */

      downloadsElement.textContent =
        formatNumber(newValue);

    }


    return true;

  }

  catch(error) {


    console.error(
      "Download counter increment error:",
      error
    );


    return false;

  }

}


/*
=====================================================
عداد المشاهدات
=====================================================
*/


async function incrementViewCount() {


  if (!CONFIG.countViews) {

    viewsElement.textContent =
      "--";

    return;

  }


  try {


    /*
    نستخدم مفتاح مختلف للمشاهدات
    */

    const viewUrl =

      "https://abacus.jasoncameron.dev/hit/" +

      encodeURIComponent(
        CONFIG.counterNamespace
      ) +

      "/views";


    const response =
      await fetch(

        viewUrl,

        {

          method:
            "GET",

          cache:
            "no-store"

        }

      );


    if (!response.ok) {

      throw new Error(
        "View counter error"
      );

    }


    const data =
      await response.json();


    const value =
      Number(data.value);


    if (
      Number.isFinite(value)
    ) {

      viewsElement.textContent =
        formatNumber(value);

    }


  }

  catch(error) {


    console.error(
      "View counter error:",
      error
    );


    viewsElement.textContent =
      "--";

  }

}


/*
=====================================================
تحميل البيانات عند فتح الموقع
=====================================================
*/


getDownloadCount();


/*
=====================================================
عداد المشاهدات
=====================================================
*/


incrementViewCount();


/*
=====================================================
زر تحميل التطبيق
=====================================================
*/


downloadBtn.addEventListener(

  "click",

  async function() {


    /*
    منع الضغط المكرر
    */

    downloadBtn.disabled =
      true;


    /*
    تغيير النص مؤقتًا
    */

    downloadBtn.textContent =
      "جاري تجهيز التحميل...";


    setStatus(
      '<span class="loading"></span> جاري تسجيل التحميل...'
    );


    /*
    =================================================
    زيادة العداد
    =================================================

    نستنى نتيجة العداد أولًا.

    بمجرد نجاح العملية:
    الرقم يظهر فورًا.
    */

    const counted =
      await incrementDownloadCount();


    /*
    =================================================
    لو العداد اشتغل
    =================================================
    */

    if (counted) {


      setStatus(
        "تم تسجيل التحميل، جاري فتح التطبيق..."
      );


    }

    else {


      /*
      حتى لو خدمة العداد لم تعمل،
      لا نمنع المستخدم من تحميل التطبيق.
      */

      setStatus(
        "جاري فتح تحميل التطبيق..."
      );

    }


    /*
    =================================================
    فتح APK
    =================================================

    نستخدم رابط GitHub المباشر.
    */

    window.location.href =
      CONFIG.apkUrl;

  }

);


/*
=====================================================
تحديث عداد التحميلات تلقائيًا
كل دقيقة
=====================================================
*/


setInterval(

  function() {

    getDownloadCount();

  },

  60000

);


</script>


</body>

</html>
